services:
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=mybudget-db
      - POSTGRES_PASSWORD=senha
      - POSTGRES_ROOT_PASSWORD=Oscar2387/*-/Papa1445/*-/
      - POSTGRES_USER=api
    ports:
      - 5432:5432
    expose:
      - 5432
    volumes:
      - mybudget_data:/var/lib/postgresql/

volumes:
  mybudget_data:
